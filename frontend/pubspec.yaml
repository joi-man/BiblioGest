name: frontend
description: "BiblioGest - Sistema Multiplataforma de Gestion Bibliotecaria"
publish_to: 'none'
version: 0.11.1+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  intl: any
  dropdown_search: ^6.0.2

  # Persistencia local (modo de tema)
  shared_preferences: ^2.3.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.7.0

  # Networking
  dio: ^5.7.0

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  web: ^1.1.1
  cryptography: ^2.9.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
  generate: true

  # Tipografia editorial (IBM Plex, licencia OFL en assets/fonts/OFL.txt)
  fonts:
    - family: IBMPlexSerif
      fonts:
        - asset: assets/fonts/IBMPlexSerif-Regular.ttf
        - asset: assets/fonts/IBMPlexSerif-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSerif-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
