version: '3.8'

services:
  db:
    image: postgres:16.6-alpine
    container_name: bibliogest_db
    restart: always
    environment:
      POSTGRES_USER: bibliogest_user
      POSTGRES_PASSWORD: bibliogest_password
      POSTGRES_DB: bibliogest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: bibliogest_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bibliogest.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bibliogest_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://bibliogest_user:bibliogest_password@db:5432/bibliogest_db
    depends_on:
      - db

volumes:
  postgres_data:
